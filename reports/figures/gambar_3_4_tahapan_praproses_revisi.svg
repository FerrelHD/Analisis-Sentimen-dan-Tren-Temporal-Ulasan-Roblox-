<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="white"/>

  <text x="450" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Gambar 3.4 Tahapan Praproses Teks (revisi — dipisah per jalur model)</text>

  <!-- Raw text input -->
  <rect x="370" y="50" width="160" height="45" rx="8" fill="white" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="450" y="77" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Teks Ulasan Mentah</text>

  <path d="M450,95 L450,115" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Tahap 2 box -->
  <rect x="15" y="115" width="870" height="150" rx="6" fill="#EEF2FF" stroke="#818CF8" stroke-dasharray="4 3"/>
  <text x="450" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA" letter-spacing="0.5">TAHAP 2 — CLEANING MINIMAL (untuk RoBERTa &amp; IndoBERT)</text>

  <g font-size="11">
    <rect x="40" y="155" width="185" height="80" rx="6" fill="white" stroke="#818CF8"/>
    <text x="132" y="180" text-anchor="middle" font-weight="700">Hapus Emoji</text>
    <text x="132" y="200" text-anchor="middle" font-size="9.5" fill="#64748B">simbol piktografis</text>

    <rect x="240" y="155" width="185" height="80" rx="6" fill="white" stroke="#818CF8"/>
    <text x="332" y="180" text-anchor="middle" font-weight="700">Hapus URL</text>
    <text x="332" y="200" text-anchor="middle" font-size="9.5" fill="#64748B">tautan/link</text>

    <rect x="440" y="155" width="185" height="80" rx="6" fill="white" stroke="#818CF8"/>
    <text x="532" y="180" text-anchor="middle" font-weight="700">Hapus Tag HTML</text>
    <text x="532" y="200" text-anchor="middle" font-size="9.5" fill="#64748B">jika ada</text>

    <rect x="640" y="155" width="185" height="80" rx="6" fill="white" stroke="#818CF8"/>
    <text x="732" y="180" text-anchor="middle" font-weight="700">Rapikan Spasi</text>
    <text x="732" y="200" text-anchor="middle" font-size="9.5" fill="#64748B">spasi berlebih -&gt; tunggal</text>
  </g>
  <text x="450" y="252" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4338CA">Huruf kapital, imbuhan, kata hubung, tanda baca TETAP DIPERTAHANKAN (teks natural)</text>

  <path d="M235,265 L235,285 L450,285 L450,300" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M665,265 L665,285 L450,285 L450,300" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="330" y="300" width="240" height="50" rx="8" fill="white" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="450" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">content_raw_clean</text>
  <text x="450" y="338" text-anchor="middle" font-size="9.5" fill="#64748B">-&gt; input RoBERTa / IndoBERT</text>

  <path d="M450,350 L450,370" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="3 3"/>
  <text x="465" y="365" font-size="10" fill="#64748B" font-style="italic">khusus SVM</text>

  <!-- Tahap 5a box -->
  <rect x="15" y="370" width="870" height="150" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-dasharray="4 3"/>
  <text x="450" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5">TAHAP 5A — PRAPROSES PENUH (khusus SVM)</text>

  <g font-size="10.5">
    <rect x="30" y="410" width="130" height="65" rx="6" fill="white" stroke="#34D399"/>
    <text x="95" y="437" text-anchor="middle" font-weight="700">Case Folding</text>
    <text x="95" y="453" text-anchor="middle" font-size="9" fill="#64748B">huruf kecil</text>

    <rect x="175" y="410" width="130" height="65" rx="6" fill="white" stroke="#34D399"/>
    <text x="240" y="437" text-anchor="middle" font-weight="700">Cleaning</text>
    <text x="240" y="453" text-anchor="middle" font-size="9" fill="#64748B">tanda baca, angka</text>

    <rect x="320" y="410" width="130" height="65" rx="6" fill="white" stroke="#34D399"/>
    <text x="385" y="437" text-anchor="middle" font-weight="700">Tokenisasi</text>
    <text x="385" y="453" text-anchor="middle" font-size="9" fill="#64748B">NLTK</text>

    <rect x="465" y="410" width="130" height="65" rx="6" fill="white" stroke="#34D399"/>
    <text x="530" y="432" text-anchor="middle" font-weight="700">Negation</text>
    <text x="530" y="447" text-anchor="middle" font-weight="700">Handling</text>
    <text x="530" y="462" text-anchor="middle" font-size="9" fill="#64748B">bisa_NEG</text>

    <rect x="610" y="410" width="130" height="65" rx="6" fill="white" stroke="#34D399"/>
    <text x="675" y="432" text-anchor="middle" font-weight="700">Stopword</text>
    <text x="675" y="447" text-anchor="middle" font-weight="700">Removal</text>
    <text x="675" y="462" text-anchor="middle" font-size="9" fill="#64748B">NLTK id</text>

    <rect x="755" y="410" width="115" height="65" rx="6" fill="white" stroke="#34D399"/>
    <text x="812" y="437" text-anchor="middle" font-weight="700">Stemming</text>
    <text x="812" y="453" text-anchor="middle" font-size="9" fill="#64748B">Sastrawi</text>
  </g>
  <path d="M160,442 L175,442" stroke="#334155" stroke-width="1.1" marker-end="url(#arrow)"/>
  <path d="M305,442 L320,442" stroke="#334155" stroke-width="1.1" marker-end="url(#arrow)"/>
  <path d="M450,442 L465,442" stroke="#334155" stroke-width="1.1" marker-end="url(#arrow)"/>
  <path d="M595,442 L610,442" stroke="#334155" stroke-width="1.1" marker-end="url(#arrow)"/>
  <path d="M740,442 L755,442" stroke="#334155" stroke-width="1.1" marker-end="url(#arrow)"/>

  <text x="450" y="500" text-anchor="middle" font-size="10.5" font-style="italic" fill="#047857">Hasil akhir -&gt; cleaned_content, dipakai TfidfVectorizer (SVM), TIDAK dipakai RoBERTa/IndoBERT</text>
</svg>
