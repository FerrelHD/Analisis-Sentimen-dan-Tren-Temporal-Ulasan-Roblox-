<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Cambria, Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="700" height="220" fill="white"/>
  <text x="350" y="28" text-anchor="middle" font-size="13" font-weight="700" font-family="Helvetica, Arial, sans-serif" fill="#1E293B">Persamaan AUC-ROC (One-vs-Rest, Macro)</text>

  <text x="350" y="75" text-anchor="middle" font-size="20" fill="#0F172A">TPR(t) = TP(t) / (TP(t) + FN(t))</text>
  <text x="350" y="105" text-anchor="middle" font-size="20" fill="#0F172A">FPR(t) = FP(t) / (FP(t) + TN(t))</text>
  <text x="350" y="140" text-anchor="middle" font-size="20" fill="#0F172A">AUC = <tspan font-size="26">∫</tspan><tspan baseline-shift="sub" font-size="13">0</tspan><tspan baseline-shift="super" font-size="13">1</tspan> TPR d(FPR)</text>

  <text x="60" y="170" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#475569">Keterangan:</text>
  <text x="60" y="187" font-size="10.5" font-family="Helvetica, Arial, sans-serif" fill="#475569">TPR = True Positive Rate (recall), FPR = False Positive Rate, pada threshold t</text>
  <text x="60" y="202" font-size="10.5" font-family="Helvetica, Arial, sans-serif" fill="#475569">One-vs-Rest: AUC dihitung per kelas (kelas vs gabungan kelas lain), lalu dirata-rata (macro) untuk 3 kelas sentimen</text>
</svg>
