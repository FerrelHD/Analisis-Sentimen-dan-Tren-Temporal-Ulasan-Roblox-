  <text x="235" y="243" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E293B">Label Manual (Blind)</text>
  <text x="235" y="259" text-anchor="middle" font-size="10" fill="#4338CA">peneliti, tanpa lihat rating/RoBERTa</text>

  <!-- 3b branch -->
  <rect x="535" y="140" width="260" height="60" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.3"/>
