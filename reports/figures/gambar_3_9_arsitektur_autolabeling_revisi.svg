  <path d="M450,100 L450,120 L235,120 L235,140" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M450,100 L450,120 L665,120 L665,140" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>

