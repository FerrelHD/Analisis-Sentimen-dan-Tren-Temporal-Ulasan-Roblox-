  <text x="665" y="179" text-anchor="middle" font-size="10" fill="#4338CA">Teacher: w11wo/indonesian-</text>
  <text x="665" y="193" text-anchor="middle" font-size="10" fill="#4338CA">roberta-base-sentiment-classifier</text>

  <path d="M665,200 L665,220" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="535" y="220" width="260" height="55" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.3"/>
  <text x="665" y="243" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E293B">pseudo_label_roberta</text>
  <text x="665" y="259" text-anchor="middle" font-size="10" fill="#4338CA">seluruh 49.484 baris</text>

  <path d="M235,275 L235,295 L450,295 L450,315" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M665,275 L665,295 L450,295 L450,315" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="330" y="315" width="240" height="60" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.3"/>
  <text x="450" y="338" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E293B">Merge label_final</text>
  <text x="450" y="354" text-anchor="middle" font-size="10" fill="#047857">manual menimpa RoBERTa</text>
  <text x="450" y="368" text-anchor="middle" font-size="10" fill="#047857">di 382 baris sampel</text>

  <path d="M450,375 L450,400" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>

