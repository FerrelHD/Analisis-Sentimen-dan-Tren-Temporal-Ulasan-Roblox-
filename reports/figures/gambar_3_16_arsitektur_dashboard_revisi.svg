  <path d="M265,419 L265,445" fill="none" stroke="#334155" stroke-width="1.4"/>
  <path d="M112,445 L792,445" fill="none" stroke="#334155" stroke-width="1.4"/>
  <path d="M112,445 L112,525" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M282,445 L282,525" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M452,445 L452,525" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M622,445 L622,525" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
