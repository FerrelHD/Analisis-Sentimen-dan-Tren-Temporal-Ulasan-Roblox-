    <text x="282" y="585" text-anchor="middle" font-size="10" fill="#065F46">Distribusi &amp; kata kunci</text>

    <rect x="375" y="525" width="155" height="150" rx="8" fill="white" stroke="#059669" stroke-width="1.3"/>
    <text x="452" y="552" text-anchor="middle" font-weight="700" fill="#1E293B">Tren</text>
    <text x="452" y="567" text-anchor="middle" font-weight="700" fill="#1E293B">Temporal</text>
    <text x="452" y="585" text-anchor="middle" font-size="10" fill="#065F46">Perubahan sentimen</text>
    <text x="452" y="598" text-anchor="middle" font-size="10" fill="#065F46">per waktu</text>

    <rect x="545" y="525" width="155" height="150" rx="8" fill="white" stroke="#059669" stroke-width="1.3"/>
    <text x="622" y="552" text-anchor="middle" font-weight="700" fill="#1E293B">Model &amp;</text>
    <text x="622" y="567" text-anchor="middle" font-weight="700" fill="#1E293B">Evaluasi</text>
    <text x="622" y="585" text-anchor="middle" font-size="10" fill="#065F46">SVM vs IndoBERT</text>

    <rect x="715" y="525" width="155" height="150" rx="8" fill="white" stroke="#059669" stroke-width="1.3"/>
    <text x="792" y="552" text-anchor="middle" font-weight="700" fill="#1E293B">Scraping &amp;</text>
    <text x="792" y="567" text-anchor="middle" font-weight="700" fill="#1E293B">Preprocessing</text>
    <text x="792" y="585" text-anchor="middle" font-size="10" fill="#065F46">Pipeline pengumpulan</text>
    <text x="792" y="598" text-anchor="middle" font-size="10" fill="#065F46">&amp; praproses data</text>
  </g>

  <!-- ===== Arrows: Data Layer -> Load Data (staggered elbow, no crossing) ===== -->
  <path d="M162,150 L162,222 L230,222 L230,260" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M449,150 L449,232 L265,232 L265,260" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M737,150 L737,242 L300,242 L300,260" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>

