  <text x="162" y="133" text-anchor="middle" font-size="10" fill="#64748B">klasifikasi IndoBERT</text>

  <rect x="322" y="55" width="255" height="95" rx="8" fill="white" stroke="#6366F1" stroke-width="1.3"/>
