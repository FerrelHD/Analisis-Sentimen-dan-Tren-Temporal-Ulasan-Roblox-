  <path d="M380,300 L560,300" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Routing Navigasi -> Visualizations (page logic renders charts) -->
  <path d="M380,387 L560,387" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>

