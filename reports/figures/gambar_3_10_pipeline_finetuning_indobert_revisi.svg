  <rect x="0" y="0" width="900" height="210" fill="white"/>
  <text x="450" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Gambar 3.10 Pipeline Fine-Tuning IndoBERT (revisi — input teks natural)</text>

